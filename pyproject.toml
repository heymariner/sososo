[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heymariner-engine"
version = "0.1.0"
description = "HeyMariner maritime content engine: research, scoring, image/video generation, and Facebook publishing with human approval."
requires-python = ">=3.11"
dependencies = [
    "requests==2.32.3",
    "Pillow==10.4.0",
    "PyYAML==6.0.2",
    "feedparser==6.0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
